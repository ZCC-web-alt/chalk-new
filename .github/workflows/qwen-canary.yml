name: Qwen Canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    environment: qwen-canary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - working-directory: backend
        run: python -m pip install -r requirements.txt
      - run: python scripts/generate_research_contract.py --check
      - run: python scripts/validate_science125_manifest.py benchmarks/science125/science125-v1.json
      - name: Materialize protected canary inputs
        env:
          SCIENCE125_CANARY_CONTEXT_INDEX_GZIP_B64_PART1: ${{ secrets.SCIENCE125_CANARY_CONTEXT_INDEX_GZIP_B64_PART1 }}
          SCIENCE125_CANARY_CONTEXT_INDEX_GZIP_B64_PART2: ${{ secrets.SCIENCE125_CANARY_CONTEXT_INDEX_GZIP_B64_PART2 }}
          SCIENCE125_CANARY_REVIEWED_EVIDENCE_B64: ${{ secrets.SCIENCE125_CANARY_REVIEWED_EVIDENCE_B64 }}
        run: >-
          python scripts/materialize_science125_canary_inputs.py
          --context-output data/science125/science125-context-v1.json
          --evidence-output data/canary-reviewed-evidence.json
      - env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_MAX_ESTIMATED_COST_CNY: ${{ vars.QWEN_MAX_ESTIMATED_COST_CNY }}
          QWEN_INPUT_COST_PER_MILLION_CNY: ${{ vars.QWEN_INPUT_COST_PER_MILLION_CNY }}
          QWEN_OUTPUT_COST_PER_MILLION_CNY: ${{ vars.QWEN_OUTPUT_COST_PER_MILLION_CNY }}
        run: >-
          python scripts/run_science_canary.py
          --manifest benchmarks/science125/science125-v1.json
          --evidence data/canary-reviewed-evidence.json
          --output-dir data/canary
          --summary-path canary-summary.json
          --ledger-path data/canary-ledger.db
          --model qwen3.8-max
          --max-total-tokens 120000
          --require-cost-budget
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-canary-evidence
          path: |
            canary-summary.json
            data/canary/*
            data/canary-ledger.db
          if-no-files-found: warn
          retention-days: 14
