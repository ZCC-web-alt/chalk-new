name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - working-directory: backend
        run: python -m pip install -r requirements.txt
      - working-directory: backend
        run: python -m unittest discover -s tests -v
      - run: python scripts/generate_research_contract.py --check
      - run: python scripts/validate_science125_manifest.py benchmarks/science125/science125-v1.json

  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests/legacy -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - working-directory: frontend
        run: pnpm lint
      - working-directory: frontend
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: backend
        run: python -m pip install -r requirements.txt
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: frontend
        env:
          NEXT_PUBLIC_CHALK_API_BASE: http://127.0.0.1:8000/api
        run: pnpm build
      - working-directory: frontend
        run: pnpm test:e2e
      - working-directory: frontend
        run: pnpm test:e2e:fullstack

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - working-directory: frontend
        run: pnpm audit --audit-level=high
      - working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - working-directory: backend
        run: python -m pip_audit --requirement requirements.txt --progress-spinner off
      - run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - run: $(go env GOPATH)/bin/gitleaks git --redact --verbose --config .gitleaks.toml .
